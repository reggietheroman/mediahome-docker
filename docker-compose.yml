services:
  # ==========================================
  # DOWNLOAD CLIENT
  # ==========================================
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - ${MEDIAHOME_DRIVE_DOWNLOADS:-/mnt/external-drive/downloads}:/downloads
    ports:
      - "${QBITTORRENT_PORT:-8080}:8080"
      - "${QBITTORRENT_BT_PORT:-6881}:6881"
      - "${QBITTORRENT_BT_PORT:-6881}:6881/udp"
    restart: unless-stopped

  # ==========================================
  # MEDIA SERVER
  # ==========================================
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config/jellyfin:/config
      - ${MEDIAHOME_DRIVE_MEDIA:-/mnt/external-drive/media}:/data/media
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    restart: unless-stopped

  # ==========================================
  # MEDIA AUTOMATION (ARR STACK)
  # ==========================================
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config/sonarr:/config
      - ${MEDIAHOME_DRIVE:-/mnt/external-drive}:/data
    ports:
      - "${SONARR_PORT:-8989}:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config/radarr:/config
      - ${MEDIAHOME_DRIVE:-/mnt/external-drive}:/data
    ports:
      - "${RADARR_PORT:-7878}:7878"
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config/bazarr:/config
      - ${MEDIAHOME_DRIVE:-/mnt/external-drive}:/data
    ports:
      - "${BAZARR_PORT:-6767}:6767"
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Etc/UTC
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    depends_on:
      - flaresolverr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    restart: unless-stopped

  # ==========================================
  # REQUEST MANAGEMENT
  # ==========================================
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    depends_on:
      - jellyfin
      - sonarr
      - radarr
    environment:
      - LOG_LEVEL=info
      - TZ=Etc/UTC
    volumes:
      - ./config/seerr:/app/config
    ports:
      - "${SEERR_PORT:-5055}:5055"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  # ==========================================
  # OBSERVABILITY & MANAGEMENT
  # ==========================================
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    environment:
      - DOZZLE_AUTH_PROVIDER=simple
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/dozzle:/data
    ports:
      - "${DOZZLE_PORT:-9999}:8080"
    restart: unless-stopped

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    volumes:
      - ./config/beszel:/beszel_data
    ports:
      - "${BESZEL_PORT:-8090}:8090"
    restart: unless-stopped
